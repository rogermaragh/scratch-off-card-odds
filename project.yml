name: LottoMin
options:
  bundleIdPrefix: com.lottomin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  LottoMin:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Sources
      - path: Data
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: LottoMin
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "Used once to detect which state's lottery games to show. Your location never leaves the device."
        # Production data is fetched over HTTPS. This exception only permits
        # cleartext to loopback/.local hosts, so a locally served lottery.json
        # can be tested without weakening transport security generally.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lottomin.app
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
